name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc pkg-config \
            libgtk-4-dev libcairo2-dev libglib2.0-dev \
            libgdk-pixbuf-2.0-dev libx11-dev libxrandr-dev libxfixes-dev \
            libpng-dev libjpeg-turbo8-dev libwebp-dev \
            libpipewire-0.3-dev libdbus-1-dev \
            librsvg2-bin imagemagick

      - name: Generate icons
        run: bash packaging/icons/generate-icons.sh

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)

      - name: Smoke test
        run: ./build/snapx --version
