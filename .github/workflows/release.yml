name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=1.3.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc pkg-config wget fuse libfuse2 \
            libgtk-4-dev libcairo2-dev libglib2.0-dev \
            libgdk-pixbuf-2.0-dev libx11-dev libxrandr-dev libxfixes-dev \
            libpng-dev libjpeg-turbo8-dev libwebp-dev \
            libpipewire-0.3-dev libdbus-1-dev \
            librsvg2-bin imagemagick file

      - name: Generate icons
        run: bash packaging/icons/generate-icons.sh

      - name: Build AppImage and tarball
        run: bash packaging/linux/build-appimage.sh "${{ steps.ver.outputs.version }}"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            packaging/linux/output/*.AppImage
            packaging/linux/output/*.tar.gz

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-cairo
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-gdk-pixbuf2
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-libwebp
            mingw-w64-ucrt-x86_64-dbus
            mingw-w64-ucrt-x86_64-librsvg

      - name: Resolve version
        id: ver
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=1.3.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Inno Setup
        shell: pwsh
        run: |
          winget install -e --id JRSoftware.InnoSetup `
            --accept-package-agreements --accept-source-agreements --silent
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC not found: $iscc" }

      - name: Build snapx binary
        run: SKIP_ISCC=1 bash packaging/windows/build-installer.sh "${{ steps.ver.outputs.version }}"

      - name: Package Windows installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC not found: $iscc" }
          $build = Join-Path $PWD "build"
          $iss = Join-Path $PWD "packaging/windows/installer.iss"
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" "/DMyBuildDir=$build" $iss
          Get-ChildItem packaging/windows/output

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: packaging/windows/output/*.exe

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=1.3.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: |
          brew install cmake gtk4 cairo glib gdk-pixbuf libpng jpeg-turbo webp pkg-config

      - name: Build DMG
        run: bash packaging/macos/build-dmg.sh "${{ steps.ver.outputs.version }}"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: packaging/macos/output/*.dmg

  build-fedora-rpm:
    runs-on: ubuntu-latest
    container:
      image: fedora:42
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=1.3.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build dependencies
        run: |
          dnf install -y rpm-build cmake gcc git \
            gtk4-devel cairo-devel glib2-devel gdk-pixbuf2-devel \
            libX11-devel libXrandr-devel libXfixes-devel \
            libpng-devel libjpeg-turbo-devel libwebp-devel \
            pipewire-devel dbus-devel desktop-file-utils \
            librsvg2 ImageMagick

      - name: Build RPM
        run: bash packaging/linux/build-rpm.sh "${{ steps.ver.outputs.version }}"

      - name: Upload Fedora RPM
        uses: actions/upload-artifact@v4
        with:
          name: fedora-rpm
          path: packaging/linux/output/*.rpm

  build-flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Flatpak builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y flathub org.gnome.Platform//48 org.gnome.Sdk//48

      - name: Build Flatpak bundle
        run: |
          mkdir -p packaging/flatpak/output
          flatpak-builder --force-clean --repo=packaging/flatpak/repo \
            packaging/flatpak/build packaging/flatpak/io.github.snapx.yml
          flatpak build-bundle packaging/flatpak/repo \
            packaging/flatpak/output/io.github.snapx.flatpak io.github.snapx

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: packaging/flatpak/output/*.flatpak

  release:
    needs: [build-linux, build-windows, build-macos, build-fedora-rpm, build-flatpak]
    runs-on: ubuntu-latest
    if: >-
      always() && !cancelled() &&
      (needs.build-linux.result == 'success' || needs.build-fedora-rpm.result == 'success')
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.3.0' }}
          name: snapx ${{ github.ref_type == 'tag' && github.ref_name || 'v1.3.0' }}
          body_path: CHANGELOG.md
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*.tar.gz
            artifacts/**/*.rpm
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
