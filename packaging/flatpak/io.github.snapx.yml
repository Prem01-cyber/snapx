app-id: io.github.snapx
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: snapx

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.portal.GlobalShortcuts
  - --talk-name=org.freedesktop.portal.Screenshot
  - --talk-name=org.freedesktop.portal.ScreenCast
  - --talk-name=org.freedesktop.host.portal.Registry
  - --filesystem=home
  - --filesystem=xdg-pictures

modules:
  - name: snapx
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: dir
        path: ../..
