<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Camera body -->
  <rect x="6" y="18" width="52" height="36" rx="6" ry="6"
        fill="#2d5fa8" stroke="#1a3a6e" stroke-width="2"/>
  <!-- Lens outer ring -->
  <circle cx="32" cy="36" r="13" fill="#1a3a6e" stroke="#0d2248" stroke-width="1.5"/>
  <!-- Lens inner -->
  <circle cx="32" cy="36" r="9" fill="#4e9ae0"/>
  <!-- Lens highlight -->
  <circle cx="29" cy="33" r="3" fill="white" opacity="0.35"/>
  <!-- Viewfinder bump -->
  <rect x="22" y="11" width="12" height="8" rx="3" ry="3" fill="#2d5fa8" stroke="#1a3a6e" stroke-width="2"/>
  <!-- Flash -->
  <rect x="8" y="21" width="6" height="4" rx="2" ry="2" fill="#f5c542"/>
  <!-- Shutter highlight top-right corner -->
  <circle cx="52" cy="22" r="2" fill="white" opacity="0.5"/>
</svg>
